<!DOCTYPE html>
<html lang="ca">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Talleret de Creps</title>

<style>

/* CONFIGURACIÓN GENERAL */

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;

  background-image:url("fons.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;

  display:flex;
  justify-content:center;
  align-items:center;
}


/* CONTENEDOR PRINCIPAL */

.container{
  width:88%;
  max-width:420px;
  text-align:center;
  padding:28px 18px 35px;
}


/* LOGOTIPO */

.logo{
  display:block;
  width:85%;
  max-width:280px;
  height:auto;
  margin:0 auto 32px;

  filter:drop-shadow(0 4px 6px rgba(0,0,0,0.25));
}


/* BOTONES GENERALES */

.boto{
  display:flex;
  justify-content:center;
  align-items:center;

  width:100%;
  min-height:62px;

  color:white;
  text-decoration:none;
  text-align:center;

  padding:16px 18px;
  margin:14px 0;

  border-radius:18px;

  font-size:21px;
  font-weight:bold;

  box-shadow:0 5px 12px rgba(0,0,0,0.25);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    filter 0.2s ease;

  -webkit-tap-highlight-color:transparent;
}


/* COLORES DE LOS IDIOMAS */

.cat{
  background:rgba(242,201,76,0.92);
  color:#3b2b00;
}

.esp{
  background:rgba(242,153,74,0.92);
}

.ang{
  background:rgba(235,87,87,0.92);
}

.fr{
  background:rgba(39,174,96,0.92);
}

.ale{
  background:rgba(47,128,237,0.92);
}


/* EFECTO AL PASAR EL RATÓN */

.boto:hover{
  transform:scale(1.025);
  filter:brightness(1.04);
  box-shadow:0 7px 16px rgba(0,0,0,0.3);
}

.boto:active{
  transform:scale(0.98);
}


/* BOTÓN DE LA CREP FUERA DE CARTA */

.fora-carta{
  position:relative;
  overflow:hidden;

  min-height:76px;
  margin-top:25px;
  padding:14px 55px;

  color:#4b2b00;

  background:
    linear-gradient(
      135deg,
      #ffe16b 0%,
      #ffc928 42%,
      #f5a800 100%
    );

  border:3px solid rgba(255,255,255,0.9);

  font-size:20px;
  line-height:1.15;

  box-shadow:
    0 6px 14px rgba(0,0,0,0.28),
    0 0 0 4px rgba(255,190,0,0.22),
    0 0 20px rgba(255,174,0,0.55);

  animation:batec 2.2s ease-in-out infinite;
}


/* ESTRELLAS LATERALES */

.fora-carta::after{
  content:"★";
  position:absolute;
  left:19px;
  top:50%;
  transform:translateY(-50%);

  font-size:30px;
  color:#fff8c7;

  text-shadow:
    0 1px 2px rgba(104,63,0,0.6),
    0 0 9px rgba(255,255,255,0.95);
}

.text-fora-carta::after{
  content:"★";
  position:absolute;
  right:19px;
  top:50%;
  transform:translateY(-50%);

  font-size:30px;
  color:#fff8c7;

  text-shadow:
    0 1px 2px rgba(104,63,0,0.6),
    0 0 9px rgba(255,255,255,0.95);
}


/* TEXTO DEL BOTÓN ESPECIAL */

.text-fora-carta{
  position:static;
  display:block;
  z-index:2;
}


/* REFLEJO ANIMADO */

.brillo{
  position:absolute;
  top:-25%;
  left:-70%;

  width:45%;
  height:150%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.65),
    transparent
  );

  transform:skewX(-24deg);

  animation:brillar 3.2s ease-in-out infinite;
}


/* ANIMACIONES */

@keyframes batec{

  0%,
  100%{
    transform:scale(1);
    box-shadow:
      0 6px 14px rgba(0,0,0,0.28),
      0 0 0 4px rgba(255,190,0,0.20),
      0 0 15px rgba(255,174,0,0.45);
  }

  50%{
    transform:scale(1.045);
    box-shadow:
      0 8px 18px rgba(0,0,0,0.32),
      0 0 0 7px rgba(255,190,0,0.20),
      0 0 28px rgba(255,174,0,0.8);
  }

}

@keyframes brillar{

  0%{
    left:-70%;
  }

  40%{
    left:140%;
  }

  100%{
    left:140%;
  }

}


/* ADAPTACIÓN PARA MÓVILES PEQUEÑOS */

@media (max-width:380px){

  .container{
    width:92%;
    padding-left:12px;
    padding-right:12px;
  }

  .logo{
    width:80%;
    margin-bottom:24px;
  }

  .boto{
    min-height:56px;
    margin:11px 0;
    padding:14px;
    font-size:19px;
  }

  .fora-carta{
    min-height:72px;
    padding-left:45px;
    padding-right:45px;
    font-size:18px;
  }

  .fora-carta::after,
  .text-fora-carta::after{
    font-size:25px;
  }

  .fora-carta::after{
    left:14px;
  }

  .text-fora-carta::after{
    right:14px;
  }

}


/* DESACTIVAR ANIMACIONES SI EL DISPOSITIVO LO SOLICITA */

@media (prefers-reduced-motion:reduce){

  .boto,
  .fora-carta,
  .brillo{
    animation:none;
    transition:none;
  }

}

</style>

</head>

<body>

<main class="container">

  <img
    src="logo.png"
    alt="El Talleret de Creps"
    class="logo"
  >

  <a
    class="boto cat"
    href="COLERA-2026-CAT.pdf"
    target="_blank"
    rel="noopener"
  >
    Català
  </a>

  <a
    class="boto esp"
    href="COLERA-2026-ESP.pdf"
    target="_blank"
    rel="noopener"
  >
    Castellano
  </a>

  <a
    class="boto ang"
    href="COLERA-2026-ANG.pdf"
    target="_blank"
    rel="noopener"
  >
    English
  </a>

  <a
    class="boto fr"
    href="COLERA-2026-FR.pdf"
    target="_blank"
    rel="noopener"
  >
    Français
  </a>

  <a
    class="boto ale"
    href="COLERA-2026-ALE.pdf"
    target="_blank"
    rel="noopener"
  >
    Deutsch
  </a>

  <a
    class="boto fora-carta"
    href="CREP-FORA-DE-CARTA.pdf"
    target="_blank"
    rel="noopener"
  >
    <span class="brillo"></span>

    <span class="text-fora-carta">
      Descobreix la<br>
      Crep Fora de Carta
    </span>
  </a>

</main>

</body>
</html>
